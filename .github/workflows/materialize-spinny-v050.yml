name: Materialize validated Spinny v0.5.0

on:
  push:
    branches:
      - spinny-v050-materialize

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spinny-v050-materialize
          fetch-depth: 0
      - name: Decode exact validated source
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/spinny-v050-b64/part*.txt > /tmp/spinny-v050.b64
          base64 -d /tmp/spinny-v050.b64 > entries/tampermonkey-standalone/spinny-mini-webp-profiles.user.js
          echo '4d450bd18c427e31ea8a38825ed9c8223045a4834a526ec041ca04256d654ce3  entries/tampermonkey-standalone/spinny-mini-webp-profiles.user.js' | sha256sum -c -
          node --check entries/tampermonkey-standalone/spinny-mini-webp-profiles.user.js
      - name: Remove materialization scaffolding
        shell: bash
        run: |
          rm -rf .tmp/spinny-v050-b64
          rm -f .github/workflows/materialize-spinny-v050.yml
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Knight Witch Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize validated Spinny v0.5.0 source'
          git push origin HEAD:spinny-v050-materialize
